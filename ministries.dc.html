<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./ministries-data.js"></script>
<style>
:root{
  --bg:#f9f8f5;--text-primary:#1a1918;--text-muted:#6b6a67;--accent:#c8922a;--accent-strong:#a9781f;
  --accent-soft:rgba(200,146,42,.12);--ink-blue:#1e3a6e;--dark-section:#1a1a2e;--white:#ffffff;
  --line:rgba(26,25,24,.10);--shadow-sm:0 1px 3px rgba(26,25,24,.06);--shadow-card:0 4px 16px rgba(26,25,24,.08);
  --shadow-lg:0 18px 48px rgba(26,25,24,.14);--radius:12px;--radius-lg:16px;--header-h:78px;--maxw:1200px;
  --font-display:"Playfair Display",Georgia,serif;--font-body:"Inter",system-ui,-apple-system,sans-serif;--ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-body);font-size:clamp(1rem,.97rem + .2vw,1.125rem);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:var(--ink-blue);text-decoration:none;transition:color .2s var(--ease)}
a:hover{color:var(--accent-strong)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.15;margin:0;color:var(--text-primary);text-wrap:balance}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.container{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:clamp(1.25rem,4vw,2.5rem)}
.eyebrow{font-family:var(--font-body);font-weight:600;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-strong);margin:0 0 1rem}

.site-header{position:sticky;top:0;height:var(--header-h);z-index:1000;display:flex;align-items:center;background:rgba(20,20,38,.92);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:0 8px 30px rgba(0,0,0,.28);border-bottom:1px solid rgba(255,255,255,.06)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:clamp(1.25rem,4vw,2.5rem)}
.brand{display:flex;align-items:center;gap:.7rem;color:#fff}
.brand:hover{color:#fff}
.brand-logo{height:46px;width:auto;display:block}
.back-link{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;padding:.55rem 1.05rem;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);color:#fff;font-weight:600;font-size:.9rem;transition:background .2s var(--ease),transform .2s var(--ease)}
.back-link:hover{background:rgba(255,255,255,.16);color:#fff;transform:translateX(-2px)}
.back-link svg{width:17px;height:17px}

.page-hero{background:linear-gradient(135deg,var(--dark-section),#141426);color:#fff;padding:clamp(3rem,7vw,5.5rem) 0;position:relative;overflow:hidden}
.page-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 100% at 12% 0%,rgba(200,146,42,.22),transparent 60%)}
.page-hero .container{position:relative;z-index:1;max-width:760px}
.page-hero .eyebrow{color:#f2d79a}
.page-hero h1{color:#fff;font-size:clamp(2.2rem,4vw,3.4rem);font-weight:700;margin-bottom:1rem}
.page-hero p{color:rgba(255,255,255,.8);font-size:clamp(1.05rem,1rem + .4vw,1.25rem);max-width:54ch;margin:0}
.hero-count{display:inline-flex;align-items:center;gap:.5rem;margin-bottom:1.5rem;font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#f2d79a;background:rgba(200,146,42,.16);border:1px solid rgba(200,146,42,.4);padding:.5rem .9rem;border-radius:999px}
.hero-count svg{width:15px;height:15px}

.section{padding:clamp(3rem,6vw,5rem) 0}
.min-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.75rem}
.min-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-card);transition:transform .25s var(--ease),box-shadow .25s var(--ease);
  display:flex;flex-direction:column;text-align:left;color:inherit}
.min-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);color:inherit}
.min-thumb{aspect-ratio:16/10;overflow:hidden;position:relative}
.min-thumb img{width:100%;height:100%;object-fit:cover;filter:grayscale(.3) brightness(.95);transition:transform .5s var(--ease),filter .4s var(--ease)}
.min-card:hover .min-thumb img{transform:scale(1.06);filter:grayscale(0) brightness(1)}
.min-thumb .icon{position:absolute;bottom:.85rem;left:.85rem;width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.94);color:var(--accent-strong);display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.min-thumb .icon svg{width:24px;height:24px}
.min-body{padding:1.35rem 1.4rem 1.5rem;display:flex;flex-direction:column;flex:1}
.min-body h3{font-size:1.3rem;margin-bottom:.5rem}
.min-body p{margin:0 0 1.2rem;color:var(--text-muted);font-size:.95rem;line-height:1.6}
.min-foot{margin-top:auto;display:flex;align-items:center;justify-content:flex-end;padding-top:1rem;border-top:1px solid var(--line)}
.min-go{font-weight:600;color:var(--accent-strong);display:inline-flex;align-items:center;gap:.4rem;font-size:.92rem}
.min-go svg{width:16px;height:16px;transition:transform .2s var(--ease)}
.min-card:hover .min-go svg{transform:translateX(3px)}

.site-footer{background:#101020;color:rgba(255,255,255,.6);padding:2.5rem 0;font-size:.85rem;margin-top:clamp(2rem,5vw,4rem)}
.site-footer .container{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.75rem}
.site-footer a{color:rgba(255,255,255,.72)}
.site-footer a:hover{color:var(--accent)}

@media (max-width:900px){ .min-grid{grid-template-columns:repeat(2,1fr)} }
@media (max-width:600px){ :root{--header-h:62px} .brand-logo{height:36px} .min-grid{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{transition-duration:.001ms !important} }
</style>
</helmet>

<!-- ============================== HEADER ============================== -->
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand" aria-label="House of Bread Church">
      <img src="uploads/logo_white.png" alt="Дім Хліба" class="brand-logo">
    </a>
    <a href="index.html#ministries" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      <span>На головну</span>
    </a>
  </div>
</header>

<main>
<!-- ============================== PAGE HERO ============================== -->
<section class="page-hero">
  <div class="container">
    <span class="hero-count" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg><span data-count></span></span>
    <p class="eyebrow">Служіння</p>
    <h1>Знайдіть своє місце для служіння</h1>
    <p>Усі напрямки служіння церкви «Дім Хліба», де кожен може реалізувати свій дар і послужити людям.</p>
  </div>
</section>

<!-- ============================== MINISTRIES GRID ============================== -->
<section class="section">
  <div class="container">
    <div class="min-grid" data-grid></div>
  </div>
</section>
</main>

<!-- ============================== FOOTER ============================== -->
<footer class="site-footer">
  <div class="container">
    <span>© 2026 House of Bread Church. Усі права захищені.</span>
    <a href="index.html">← Повернутися на головну</a>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){
    const root = this.el || document;
    const $ = (s)=>root.querySelector(s);
    const list = (window.HOB_MINISTRIES || []);
    const icons = {
      book:'<path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2V5Z"/><path d="M8 3v18"/>',
      home:'<path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/>',
      media:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="m10 9 5 3-5 3V9Z"/>',
      worship:'<path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>',
      child:'<circle cx="12" cy="6" r="3"/><path d="M6 21v-2a6 6 0 0 1 12 0v2"/>',
      youth:'<circle cx="9" cy="7" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 21v-2a6 6 0 0 1 12 0v2"/>',
      teen:'<circle cx="12" cy="7" r="3"/><path d="M5 21v-1a7 7 0 0 1 14 0v1"/>',
      order:'<path d="M4 6h16M4 12h16M4 18h10"/>',
      care:'<path d="M12 21s-7-4.5-9-9A5 5 0 0 1 12 6a5 5 0 0 1 9 6c-2 4.5-9 9-9 9Z"/>',
      chapel:'<path d="M12 2v6M9 5h6M6 22V11l6-4 6 4v11"/>',
      prophetic:'<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>',
      hospital:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 8v6M9 11h6"/>',
      biz:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
      pray:'<path d="M12 2v9M8 7c0 3 2 4 4 4s4-1 4-4M6 22c0-4 3-7 6-7s6 3 6 7"/>',
      mercy:'<path d="M20 8.5a4.5 4.5 0 0 0-8-2.8A4.5 4.5 0 0 0 4 8.5c0 4 8 9.5 8 9.5s8-5.5 8-9.5Z"/>',
      prison:'<path d="M4 3v18M9 3v18M14 3v18M19 3v18"/>',
      family:'<circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="7" r="2.5"/><path d="M2 20v-1a5 5 0 0 1 10 0v1M12 20v-1a5 5 0 0 1 10 0v1"/>',
      globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'
    };
    const arr = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    const grid = $('[data-grid]');
    if(grid){
      grid.innerHTML = list.map(m=>{
        const sig = 'https://picsum.photos/seed/hob-min-'+m.id+'-1/600/400';
        return `<a class="min-card" href="ministry.dc.html?id=${m.id}">
          <div class="min-thumb"><img loading="lazy" src="${sig}" alt="${m.uk[0]}">
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[m.ic]||''}</svg></span>
          </div>
          <div class="min-body">
            <h3>${m.uk[0]}</h3>
            <p>${m.uk[1]}</p>
            <div class="min-foot"><span class="min-go">Детальніше ${arr}</span></div>
          </div>
        </a>`;
      }).join('');
    }
    const cnt = $('[data-count]');
    if(cnt) cnt.textContent = list.length + ' напрямків служіння';
  }
}
</script>
</body>
</html>
