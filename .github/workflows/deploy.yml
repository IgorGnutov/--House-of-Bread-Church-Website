name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Дозволи рівно під деплой на Pages, і нічого більше.
permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; проміжні пуші не перебивають той, що вже котиться.
# GitHub тримає в черзі лише одну збірку групи: пачка публікацій у
# Storyblok (кожна — вебхук) дає одну-дві збірки, а не десять.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Код виходу fb:pull — для задачі facebook-feed нижче.
    outputs:
      facebook: ${{ steps.fb.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v5

      # Етап 5: джерело правди — Storyblok. Кожна збірка main (пуш коду,
      # вебхук публікації, ручний запуск) бере опубліковану версію. Без
      # токена крок падає — тихо зібрати застарілий src/content не можна.
      # Токен Public дає лише читання опублікованого.
      - name: Pull published content from Storyblok
        env:
          STORYBLOK_PUBLIC_TOKEN: ${{ secrets.STORYBLOK_PUBLIC_TOKEN }}
          STORYBLOK_REGION: eu
        run: npm run cms:pull

      # Спека 5: 12 останніх постів сторінки Facebook. Деплой через Facebook
      # не падає ніколи: крок завершується успішно й лише передає код виходу
      # (0 — знімок записано, 2 — записано, але частину постів відкинула
      # схема, 1 — нічого не записано). Тричі на день прогін запускає cron
      # прев'ю-воркера (src/preview/schedule.mjs).
      - name: Pull Facebook feed
        id: fb
        env:
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: |
          set +e
          npm run fb:pull
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # Facebook не відповів — останній добрий знімок із кешу (зберігається
      # нижче, після npm test). Кеш використовується тричі на день, тож
      # 7-денне витіснення GitHub йому не загрожує. Знімка немає — стрічка
      # порожня, і головна показує ручні картки.
      - name: Restore last Facebook feed snapshot
        if: steps.fb.outputs.code == '1'
        uses: actions/cache/restore@v4
        with:
          path: |
            src/content/facebook
            public/uploads/facebook
          key: facebook-feed-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: facebook-feed-

      # Сторінки проєкту живуть під підшляхом. Коли зʼявиться домен —
      # SITE_URL на нього, BASE_PATH на "/" (Етап 0).
      # npm test замість npm run build: зламана збірка чи бите посилання
      # під підшляхом не доїдуть до ефіру.
      - name: Build and verify output
        env:
          SITE_URL: https://igorgnutov.github.io
          BASE_PATH: /--House-of-Bread-Church-Website/
          # Прев'ю-стенд закритий від індексації (Спека 2): noindex на кожній
          # сторінці, без sitemap. Продакшн-збірка на
          # домені — без цієї змінної.
          SITE_NOINDEX: 'true'
        run: npm test

      # Зберігається лише знімок, що пройшов npm test (типова умова
      # success()): інакше пост, який валить збірку, став би «останнім
      # добрим», і код 1 згодом знову відновив би його. run_attempt — щоб
      # повторний запуск прогону не впирався в уже зайнятий ключ.
      - name: Save Facebook feed snapshot
        if: steps.fb.outputs.code != '1'
        uses: actions/cache/save@v4
        with:
          path: |
            src/content/facebook
            public/uploads/facebook
          key: facebook-feed-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Статична копія на Cloudflare Pages (рішення 19): той самий стягнутий
      # контент і код, що щойно пройшли npm test, — інша лише адреса (корінь,
      # а не підшлях GitHub Pages). Копія дублює основний сайт, тому noindex.
      # Вимикач — змінна репозиторію CLOUDFLARE_PROJECT: без неї кроки
      # пропускаються.
      - name: Build Cloudflare Pages copy
        if: vars.CLOUDFLARE_PROJECT != ''
        env:
          SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
          BASE_PATH: /
          SITE_NOINDEX: 'true'
        run: npx astro build --outDir dist-cloudflare

      - name: Upload Cloudflare Pages copy
        if: vars.CLOUDFLARE_PROJECT != ''
        uses: actions/upload-artifact@v4
        with:
          name: dist-cloudflare
          path: dist-cloudflare
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Окреме завдання: збій Cloudflare (токен, ліміт 25 МБ на файл) не
  # зупиняє деплой на GitHub Pages. Direct Upload: Cloudflare нічого не
  # збирає сам (ліміт збірок Pages стосується саме його збірок — звірити в
  # Задачі 11).
  deploy-cloudflare:
    needs: build
    if: vars.CLOUDFLARE_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-cloudflare
          path: dist-cloudflare

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-cloudflare --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=main

  # Спека 5: сигнал власнику. Сайт на цей момент уже задеплоєно — падає лише
  # ця задача, і GitHub надсилає лист про невдалий прогін. Постійні листи
  # означають відкликаний Page-токен (новий — у секреті FACEBOOK_PAGE_TOKEN).
  facebook-feed:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Facebook feed
        env:
          CODE: ${{ needs.build.outputs.facebook }}
        run: |
          if [ -z "$CODE" ]; then
            echo "::notice::fb:pull не запускався — збірка впала раніше, про це вже є помилка"
            exit 0
          fi
          if [ "$CODE" != "0" ]; then
            echo "::error::fb:pull завершився з кодом $CODE (1 — Facebook не відповів або токен недійсний, показано минулий знімок; 2 — частину постів відкинула схема). Деталі — у лозі кроку «Pull Facebook feed» задачі build."
            exit 1
          fi
